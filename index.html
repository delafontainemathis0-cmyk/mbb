<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veux-tu être ma Valentine, ma chérie ?</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fecfef);
            color: #333;
            text-align: center;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        h1 {
            font-size: 2.5em;
            color: #e91e63;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.2em;
            margin-bottom: 30px;
        }
        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        button {
            background: #ff4081;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2em;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }
        button:hover {
            background: #e91e63;
            transform: scale(1.05);
        }
        #noBtn {
            background: #9e9e9e;
        }
        #noBtn:hover {
            background: #757575;
        }
        #message {
            display: none;
            font-size: 1.5em;
            color: FFFFFF;
            margin-top: 20px;
            animation: fadeIn 1s;
            line-height: 1.4em; /* espace entre lignes pour mieux équilibrer */
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .hearts {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }
        .heart {
            position: absolute;
            color: #ff4081;
            font-size: 2em;
            opacity: 0.7;
            animation: float 6s infinite linear;
        }
        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg) translateX(0); }
            50% { transform: translateY(50vh) rotate(180deg) translateX(20px); }
            100% { transform: translateY(-10vh) rotate(360deg) translateX(-10px); }
        }
    </style>
</head>
<body>
    <div class="hearts" id="hearts"></div>
    <h1>Veux-tu être ma Valentine ? 💗</h1>
    <p>Choisis un bouton, mon cœur... 😊</p>
    <div class="buttons">
        <button id="yesBtn">Oui 💖</button>
        <button id="noBtn">Non 😢</button>
    </div>
    <div id="message"></div>

    <script>
        // Fonction pour créer des cœurs flottants (cœurs de fond)
        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = (1 + Math.random() * 2) + 'em';
            heart.style.opacity = 0.5 + Math.random() * 0.5;
            heart.style.animationDelay = Math.random() * 6 + 's';
            document.getElementById('hearts').appendChild(heart);
            setTimeout(() => heart.remove(), 6000);
        }

        // Petit delay avant de commencer les cœurs de fond pour éviter le tas en haut
        setTimeout(() => {
            setInterval(createHeart, 500);
        }, 1000); // 1s d'attente avant que les cœurs commencent

        // Variables pour les clics
        let noClicks = 0;
        const messages = [
            "Réfléchis bien !",
            "Allez, mon cœur, dis oui ! 💕",
            "Tu es sûre ?",
            "Sérieux !?",
            "Dernière chance, sinon le bouton disparaît !"
        ];

        // Gestion du bouton Non
        document.getElementById('noBtn').addEventListener('click', function() {
            noClicks++;
            if (noClicks < 5) {
                this.style.transform = `scale(${1 - noClicks * 0.2})`;
                document.getElementById('yesBtn').style.transform = `scale(${1 + noClicks * 0.1})`;
                document.getElementById('message').innerHTML = `<p>${messages[noClicks - 1]}</p>`;
                document.getElementById('message').style.display = 'block';
            } else {
                this.style.display = 'none';
                document.getElementById('message').innerHTML = `<p>Le bouton Non a disparu !<br>Maintenant, dis oui, mon cœur ! 😜</p>`;
            }
        });

        // Fonction pour créer des petits cœurs roses au clic Oui
        function burstHearts(x, y) {
            for(let i=0; i<15; i++){
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.innerHTML = '💖'; // cœur rose Apple
                heart.style.left = x + 'px';
                heart.style.top = y + 'px';
                heart.style.fontSize = (0.8 + Math.random()*1.2) + 'em';
                heart.style.opacity = 0.8;
                heart.style.position = 'absolute';
                const angle = Math.random() * 2 * Math.PI;
                const distance = 50 + Math.random() * 50;
                const dx = Math.cos(angle) * distance;
                const dy = Math.sin(angle) * distance;
                heart.style.transition = 'transform 1s ease-out, opacity 1s ease-out';
                document.body.appendChild(heart);
                setTimeout(() => {
                    heart.style.transform = `translate(${dx}px, ${dy}px)`;
                    heart.style.opacity = 0;
                }, 10);
                setTimeout(() => heart.remove(), 1100);
            }
        }

        // Gestion du bouton Oui
        document.getElementById('yesBtn').addEventListener('click', function(e) {
            document.querySelector('.buttons').style.display = 'none';
            const rect = e.target.getBoundingClientRect();
            const x = rect.left + rect.width/2;
            const y = rect.top + rect.height/2;
            burstHearts(x, y); // explosion de cœurs roses

            // Message final réorganisé pour mieux s'équilibrer
            document.getElementById('message').innerHTML = `
                <p>Yeahhhhh !<br>
                J'en ai tellement de la chance !<br>
                Je t'aime mon petit bb, tu es la meilleure Valentine du monde ! 😍❤</p>
            `;
            document.getElementById('message').style.display = 'block';
        });
    </script>
</body>
</html>

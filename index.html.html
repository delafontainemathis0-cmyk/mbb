<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veux-tu être ma Valentine, ma chérie ?</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fecfef);
            color: #333;
            text-align: center;
            padding: 50px;
            margin: 0;
            overflow: hidden;
        }
        h1 {
            font-size: 2.5em;
            color: #e91e63;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.2em;
            margin-bottom: 30px;
        }
        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        button {
            background: #ff4081;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2em;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }
        button:hover {
            background: #e91e63;
            transform: scale(1.05);
        }
        #noBtn {
            background: #9e9e9e; /* Gris pour le bouton Non */
        }
        #noBtn:hover {
            background: #757575;
        }
        #message {
            display: none;
            font-size: 1.5em;
            color: FFFFFF;
            margin-top: 20px;
            animation: fadeIn 1s;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .hearts {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }
        .heart {
            position: absolute;
            color: #ff4081;
            font-size: 2em;
            animation: float 6s infinite linear;
        }
        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); }
            100% { transform: translateY(-100vh) rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="hearts" id="hearts"></div>
    <h1>Veux-tu être ma Valentine ? 💗</h1>
    <p>Choisis un bouton, mon cœur... 😊</p>
    <div class="buttons">
        <button id="yesBtn">Oui 💖</button>
        <button id="noBtn">Non 😢</button>
    </div>
    <div id="message"></div>

    <script>
        // Fonction pour créer des cœurs flottants
        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDelay = Math.random() * 6 + 's';
            document.getElementById('hearts').appendChild(heart);
            setTimeout(() => heart.remove(), 6000);
        }
        setInterval(createHeart, 500);

        // Variables pour les clics
        let noClicks = 0;
        const messages = [
            "Réfléchis bien !",
            "Allez, mon cœur, dis oui ! 💕",
            "Tu es sûre ? ",
            "Sérieux !?",
            "Dernière chance, sinon le bouton disparaît !"
        ];

        // Gestion du bouton Non
        document.getElementById('noBtn').addEventListener('click', function() {
            noClicks++;
            if (noClicks < 5) {
                // Réduire la taille du bouton Non
                this.style.transform = `scale(${1 - noClicks * 0.2})`;
                // Agrandir le bouton Oui
                document.getElementById('yesBtn').style.transform = `scale(${1 + noClicks * 0.1})`;
                // Afficher un message
                document.getElementById('message').innerHTML = `<p>${messages[noClicks - 1]}</p>`;
                document.getElementById('message').style.display = 'block';
            } else {
                // Après 5 clics, cacher le bouton Non
                this.style.display = 'none';
                document.getElementById('message').innerHTML = `<p>Le bouton Non a disparu ! Maintenant, dis oui, mon cœur ! 😜</p>`;
            }
        });

        // Gestion du bouton Oui
        document.getElementById('yesBtn').addEventListener('click', function() {
            // Cacher les boutons
            document.querySelector('.buttons').style.display = 'none';
            // Afficher le message final
            document.getElementById('message').innerHTML = `
                <p>Yeahhhhh j'en ai de la chance ! Je t'aime mon petit bb t'es la meilleure Valentine du monde ! 😍❤</p>
            `;
            document.getElementById('message').style.display = 'block';
        });
    </script>
</body>
</html>
